name: Dependency Security Autofix

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix
      - name: Commit generated dependency fixes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes produced by npm audit fix.'
            exit 0
          fi
          git config user.name 'eiasc-security-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: apply npm audit fixes'
          git push
