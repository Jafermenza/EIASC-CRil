name: Dependency Security Gate

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile from approved dependency ranges
        run: npm install --package-lock-only
      - name: Apply compatible npm security fixes to lockfile
        run: npm audit fix --package-lock-only
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile is already current.'
          else
            git config user.name 'eiasc-security-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'security: refresh dependency lockfile'
            git push
          fi
      - name: Audit all dependency severities
        run: npm audit --audit-level=low
      - name: Typecheck
        run: npm run typecheck
      - name: Build API and web
        run: npm run build
      - name: API unit tests
        run: npm test
