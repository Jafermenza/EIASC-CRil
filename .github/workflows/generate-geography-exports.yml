name: Generate Geography Exports

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/ethiopia-geography-export

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate geography exports
        run: npm run db:export-geography

      - name: Commit generated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geography/ethiopia-administrative-divisions.csv data/geography/ethiopia-administrative-divisions.sql
          if git diff --cached --quiet; then
            echo "No geography export changes."
            exit 0
          fi
          git commit -m "data: refresh Ethiopia geography exports"
          git push
