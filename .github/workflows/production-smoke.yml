name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Production web URL'
        required: true
        type: string
      api_url:
        description: 'Production API URL'
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_WEB_URL: ${{ inputs.web_url }}
      PRODUCTION_API_URL: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run ops:smoke
