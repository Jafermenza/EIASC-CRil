name: CI

on:
  push:
    branches: ['main', 'develop', 'feature/**', 'fix/**', 'release/**']
  pull_request:
    branches: ['main']

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://cril:cril@localhost:5432/cril?schema=public
      JWT_SECRET: ci-secret-that-is-at-least-32-characters-long
      JWT_ISSUER: eiasc-cril
      GEOGRAPHY_SOURCE_VERSION: 418739e33760bf79661f3914e2d8c9cf33248437
      REGISTRATION_INDIVIDUAL_FEE_ETB: 100
      REGISTRATION_INSTITUTION_FEE_ETB: 1000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cril
          POSTGRES_PASSWORD: cril
          POSTGRES_DB: cril
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cril -d cril"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run db:generate
      - name: Validate and apply the complete migration chain on an empty database
        run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:import-geography
      - run: npm run db:verify-geography
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run ops:backup-restore
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run M9 notification services acceptance suite
        run: npx playwright test e2e/m9-notifications.acceptance.spec.ts
