name: CI

on:
  push:
    branches:
      - main
      - "reconciliation/**"
  pull_request:
    branches:
      - main
      - "reconciliation/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eiasc_cril
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d eiasc_cril"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eiasc_cril?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify production Prisma engines
        run: |
          set -euo pipefail
          test -f node_modules/.prisma/client/libquery_engine-debian-openssl-1.0.x.so.node
          test -f node_modules/.prisma/client/libquery_engine-debian-openssl-1.1.x.so.node
          echo "Prisma production engines: OK"

      - name: Deploy database migrations
        run: npm run db:deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: |
          FILES=$(find apps -type f \( -name '*.ts' -o -name '*.tsx' \) ! -path '*/node_modules/*' ! -path '*/.next/*' ! -path 'apps/web/next-env.d.ts' ! -path 'apps/web/app/admin/review/page.tsx')
          npx eslint $FILES

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Prepare production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test -f server.js
          test -f apps/api/dist/main.js
          test -f apps/web/.next/BUILD_ID
          test -f apps/web/.next/standalone/apps/web/server.js
          mkdir -p apps/web/.next/standalone/apps/web/.next
          rm -rf apps/web/.next/standalone/apps/web/.next/static
          cp -a apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          if [ -d apps/web/public ]; then
            rm -rf apps/web/.next/standalone/apps/web/public
            cp -a apps/web/public apps/web/.next/standalone/apps/web/public
          fi
          tar -czf "eiasc-cril-${GITHUB_SHA}.tar.gz" \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./apps/web/.next/cache' \
            package.json package-lock.json server.js \
            apps/api/dist apps/api/package.json \
            apps/web/.next apps/web/package.json \
            prisma scripts

      - name: Upload production artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: eiasc-cril-release-${{ github.sha }}
          path: eiasc-cril-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
